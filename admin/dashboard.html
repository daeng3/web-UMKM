<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dashboard - Panel Penjual Cemilan Ciamis</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

  <div class="admin-topbar">
    <div class="container">
      <div>
        <div class="admin-topbar__title">Dashboard</div>
        <div class="text-sm color-muted" id="topbarSellerName">Memuat...</div>
      </div>
    </div>
  </div>

  <div class="container mt-6">
    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-card__icon purple">📦</div>
        <div class="stat-card__value" id="statTotalProduk">0</div>
        <div class="stat-card__label">Total Produk</div>
      </div>
      <div class="stat-card">
        <div class="stat-card__icon gold">👁️</div>
        <div class="stat-card__value" id="statTotalDilihat">0</div>
        <div class="stat-card__label">Total Dilihat</div>
      </div>
      <div class="stat-card">
        <div class="stat-card__icon green">✅</div>
        <div class="stat-card__value" id="statProdukAktif">0</div>
        <div class="stat-card__label">Produk Aktif</div>
      </div>
      <div class="stat-card">
        <div class="stat-card__icon red">✨</div>
        <div class="stat-card__value" id="statProdukBaru">0</div>
        <div class="stat-card__label">Produk Baru</div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="quick-actions" style="display: flex; gap: var(--space-3); flex-wrap: wrap;">
      <a href="tambah-produk.html" class="quick-action-btn" style="flex: 1; min-width: 200px;">
        <span class="icon">➕</span> Tambah Produk Baru
      </a>
      <a href="kelola-penjual.html" class="quick-action-btn" id="btnKelolaPenjual" style="display: none; flex: 1; min-width: 200px; background: var(--warning-50); border-color: var(--warning-300); color: var(--warning-900);">
        <span class="icon">👥</span> Kelola Akun Penjual
      </a>
      <a href="kategori.html" class="quick-action-btn" id="btnKelolaKategori" style="display: none; flex: 1; min-width: 200px; background: var(--success-50); border-color: var(--success-300); color: var(--success-900);">
        <span class="icon">📂</span> Kelola Kategori
      </a>
    </div>

    <!-- Chart Section -->
    <div class="admin-section-header">
      <h3>Statistik Dilihat</h3>
    </div>
    <div class="admin-card mb-6">
      <div class="bar-chart" id="chartViews">
        <!-- Bars generated by JS -->
      </div>
    </div>

    <!-- Popular Products -->
    <div class="admin-section-header">
      <h3>Produk Terpopuler</h3>
      <a href="produk.html">Lihat Semua</a>
    </div>
    <div class="admin-product-list mb-8" id="popularProductList">
      <!-- Generated by JS -->
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <div class="bottom-nav__items">
      <a href="dashboard.html" class="bottom-nav__item active">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        <span>Dasbor</span>
      </a>
      <a href="produk.html" class="bottom-nav__item">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
        <span>Produk</span>
      </a>
      <a href="kelola-penjual.html" class="bottom-nav__item" id="navSellerTab" style="display: none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Penjual</span>
      </a>
      <a href="kategori.html" class="bottom-nav__item" id="navKategoriTab" style="display: none;">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
        <span>Kategori</span>
      </a>
      <a href="profil.html" class="bottom-nav__item">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        <span>Profil</span>
      </a>
    </div>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Authentication Check via Supabase
      const auth = await checkAuth();
      if (!auth.authenticated) {
        window.location.href = 'login.html';
        return;
      }

      const sellerId = auth.seller ? auth.seller.id : null;
      const role = sellerId === 'super-admin' ? 'super_admin' : 'seller'; 
      let products = [];

    if (role === 'super_admin') {
      document.getElementById('topbarSellerName').textContent = "👑 Super Admin Paguyuban (Semua Toko)";
      document.getElementById('navSellerTab').style.display = 'flex';
      document.getElementById('navKategoriTab').style.display = 'flex';
      document.getElementById('btnKelolaPenjual').style.display = 'flex';
      document.getElementById('btnKelolaKategori').style.display = 'flex';
      products = PRODUCTS;
    } else {
      const seller = getSellerById(sellerId);
      if(seller) {
        document.getElementById('topbarSellerName').textContent = seller.shopName;
      }
      products = PRODUCTS.filter(p => p.sellerId === sellerId);
    }
    
    // Calculate Stats
    const totalProduk = products.length;
    const totalDilihat = products.reduce((acc, p) => acc + p.viewCount, 0);
    const produkAktif = products.filter(p => p.isActive).length;
    const produkBaru = products.filter(p => p.isNew).length;

    document.getElementById('statTotalProduk').textContent = totalProduk;
    document.getElementById('statTotalDilihat').textContent = totalDilihat;
    document.getElementById('statProdukAktif').textContent = produkAktif;
    document.getElementById('statProdukBaru').textContent = produkBaru;

    // Render Bar Chart (Max 5 products)
    const chartContainer = document.getElementById('chartViews');
    const sortedByViews = [...products].sort((a,b) => b.viewCount - a.viewCount);
    const topChartProducts = sortedByViews.slice(0, 5);
    const maxViews = Math.max(...topChartProducts.map(p => p.viewCount), 1); // Avoid div by 0

    chartContainer.innerHTML = topChartProducts.map(p => {
      const heightPercent = (p.viewCount / maxViews) * 100;
      return `
        <div class="bar-chart__bar">
          <div class="bar-chart__fill" style="height: ${heightPercent}%" title="${p.viewCount} kali dilihat"></div>
          <div class="bar-chart__label truncate" style="max-width:50px;">${p.name.split(' ')[0]}</div>
        </div>
      `;
    }).join('');

    // Render Popular Products
    // Render Popular Products
    const popularList = document.getElementById('popularProductList');
    popularList.innerHTML = topChartProducts.map(p => `
      <div class="admin-product-item">
        <div class="admin-product-item__image">${p.emoji}</div>
        <div class="admin-product-item__info">
          <div class="admin-product-item__name">${p.name}</div>
          <div class="admin-product-item__price">${formatRupiah(p.basePrice)}</div>
          <div class="admin-product-item__views">👁️ ${p.viewCount} kali dilihat</div>
        </div>
      </div>
    `).join('');
    });
  </script>
</body>
</html>
