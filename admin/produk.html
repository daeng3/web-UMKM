<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Produk - Panel Penjual Cemilan Ciamis</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

  <div class="admin-topbar">
    <div class="container">
      <div class="admin-topbar__title" id="topbarTitle">Produk Saya</div>
    </div>
  </div>

  <div class="container mt-6">
    <!-- Super Admin Shop Filter -->
    <div id="superAdminFilter" class="mb-6" style="display: none;">
      <label class="form-label text-xs color-muted mb-1">Filter Toko (Khusus Super Admin)</label>
      <select class="form-select" id="filterSellerSelect" onchange="renderProducts()">
        <option value="all">👑 Semua Toko (Gabungan)</option>
      </select>
    </div>

    <div class="admin-product-list mb-8" id="productList">
      <!-- Generated by JS -->
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal" id="deleteModal">
    <div class="modal__backdrop" onclick="closeModal()"></div>
    <div class="modal__content">
      <div class="modal__icon">🗑️</div>
      <h3>Hapus Produk?</h3>
      <p>Apakah Anda yakin ingin menghapus produk ini? Tindakan ini tidak dapat dibatalkan.</p>
      <div class="modal__actions">
        <button class="btn btn-secondary" onclick="closeModal()">Batal</button>
        <button class="btn btn-danger" onclick="confirmDelete()">Hapus</button>
      </div>
    </div>
  </div>

  <!-- FAB -->
  <a href="tambah-produk.html" class="fab" title="Tambah Produk Baru">➕</a>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <div class="bottom-nav__items">
      <a href="dashboard.html" class="bottom-nav__item">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        <span>Dasbor</span>
      </a>
      <a href="produk.html" class="bottom-nav__item active">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
        <span>Produk</span>
      </a>
      <a href="kelola-penjual.html" class="bottom-nav__item" id="navSellerTab" style="display: none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Penjual</span>
      </a>
      <a href="profil.html" class="bottom-nav__item">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        <span>Profil</span>
      </a>
    </div>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const auth = await checkAuth();
      if (!auth.authenticated) {
        window.location.href = 'login.html';
        return;
      }
      const sellerId = auth.seller ? auth.seller.id : null;
      const role = 'seller'; // Simplification for production MVP
    
    let productToDelete = null;

    if (role === 'super_admin') {
      document.getElementById('topbarTitle').textContent = "Semua Produk (Super Admin)";
      document.getElementById('navSellerTab').style.display = 'flex';
      const filterBox = document.getElementById('superAdminFilter');
      const filterSelect = document.getElementById('filterSellerSelect');
      filterBox.style.display = 'block';
      SELLERS.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = `🏪 ${s.shopName} (${s.name})`;
        filterSelect.appendChild(opt);
      });
    }

    function renderProducts() {
      const productList = document.getElementById('productList');
      let displayProducts = [];

      if (role === 'super_admin') {
        const selectedSeller = document.getElementById('filterSellerSelect').value;
        if (selectedSeller === 'all') {
          displayProducts = PRODUCTS;
        } else {
          displayProducts = PRODUCTS.filter(p => p.sellerId === selectedSeller);
        }
      } else {
        displayProducts = PRODUCTS.filter(p => p.sellerId === sellerId);
      }

      if(displayProducts.length === 0) {
        productList.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📦</div>
            <h3>Belum Ada Produk</h3>
            <p>Belum ada produk yang terdaftar di toko ini. Yuk tambah produk baru!</p>
          </div>
        `;
        return;
      }

      productList.innerHTML = displayProducts.map((p) => {
        const sellerObj = getSellerById(p.sellerId);
        const shopBadge = role === 'super_admin' && sellerObj ? `<div style="font-size: 10px; color: var(--primary-600); font-weight: 700; margin-bottom: 2px;">🏪 ${sellerObj.shopName}</div>` : '';

        return `
          <div class="admin-product-item" id="product-${p.id}">
            <div class="admin-product-item__image">${p.emoji || '🛍️'}</div>
            <div class="admin-product-item__info">
              ${shopBadge}
              <div class="admin-product-item__name">${p.name}</div>
              <div class="admin-product-item__price">${formatRupiah(p.basePrice)}</div>
              <div class="admin-product-item__views">👁️ ${p.viewCount || 0} kali dilihat</div>
            </div>
            <div class="admin-product-item__actions">
              <div class="toggle ${p.isActive ? 'active' : ''}" onclick="toggleStatus('${p.id}')" title="Aktif / Nonaktifkan Produk"></div>
              <a href="tambah-produk.html?id=${p.id}" class="btn btn-sm btn-ghost" style="padding: 4px; font-size:1.2rem;" title="Edit Produk">✏️</a>
              <button class="btn btn-sm btn-ghost" style="padding: 4px; font-size:1.2rem;" onclick="openModal('${p.id}')" title="Hapus Produk">🗑️</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleStatus(productId) {
      const prod = PRODUCTS.find(p => p.id === productId);
      if (prod) {
        prod.isActive = !prod.isActive;
        saveProductsToStorage();
        renderProducts();
      }
    }

    function openModal(productId) {
      productToDelete = productId;
      document.getElementById('deleteModal').classList.add('active');
    }

    function closeModal() {
      productToDelete = null;
      document.getElementById('deleteModal').classList.remove('active');
    }

    function confirmDelete() {
      if(productToDelete) {
        const idx = PRODUCTS.findIndex(p => p.id === productToDelete);
        if (idx !== -1) {
          PRODUCTS.splice(idx, 1);
          saveProductsToStorage();
        }
        renderProducts();
        closeModal();
      }
    }

    // Initial render
    renderProducts();
      });
  </script>
</body>
</html>
