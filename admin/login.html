<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login & Pendaftaran - Panel Penjual Cemilan Ciamis</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
  <style>
    .password-wrapper { position: relative; display: flex; align-items: center; }
    .password-wrapper .form-input { padding-right: 44px; width: 100%; }
    .btn-toggle-password { position: absolute; right: 12px; background: none; border: none; cursor: pointer; font-size: 1.2rem; color: var(--text-muted); padding: 0; }
    .auth-tabs { display: flex; background: var(--neutral-100); padding: 4px; border-radius: var(--radius-lg); margin-bottom: var(--space-5); }
    .auth-tab-btn { flex: 1; padding: var(--space-2) var(--space-3); border: none; background: transparent; font-family: var(--font-heading); font-size: var(--text-sm); font-weight: 600; color: var(--text-secondary); cursor: pointer; border-radius: var(--radius-md); transition: all var(--transition-fast); }
    .auth-tab-btn.active { background: var(--bg-surface); color: var(--primary-700); box-shadow: var(--shadow-sm); }
    .notice-box { background: var(--warning-50); border: 1px solid var(--warning-500); border-radius: var(--radius-lg); padding: var(--space-4); margin-bottom: var(--space-5); text-align: left; color: #854d0e; font-size: var(--text-xs); line-height: 1.5; }
    .success-box { background: var(--success-50); border: 1px solid var(--success-500); border-radius: var(--radius-lg); padding: var(--space-4); margin-bottom: var(--space-5); text-align: left; color: var(--success-600); font-size: var(--text-sm); line-height: 1.5; }
  </style>
</head>
<body class="admin-body">

  <div class="login-container">
    <div class="login-card">
      <div class="login-card__logo">
        <div style="background: var(--gradient-primary); width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem;">🛍️</div>
      </div>
      
      <!-- AUTH TABS -->
      <div class="auth-tabs">
        <button class="auth-tab-btn active" id="tabLogin" type="button">Masuk</button>
        <button class="auth-tab-btn" id="tabRegister" type="button">Daftar Akun</button>
      </div>
      
      <!-- 1. FORM LOGIN -->
      <div id="loginSection">
        <h2>Panel Penjual</h2>
        <p>Masuk dengan email Anda untuk mengelola platform</p>

        <form id="loginForm" style="text-align: left;">
          <div class="form-group">
            <label class="form-label" for="emailInput">Email</label>
            <input type="email" class="form-input" id="emailInput" placeholder="Contoh: toko@email.com" required autocomplete="username">
          </div>

          <div class="form-group mt-4">
            <label class="form-label" for="passwordInput">Password</label>
            <div class="password-wrapper">
              <input type="password" class="form-input" id="passwordInput" placeholder="Masukkan password..." required autocomplete="current-password">
              <button type="button" class="btn-toggle-password" id="btnTogglePassword" title="Tampilkan/Sembunyikan Password" aria-label="Toggle Password">👁️</button>
            </div>
          </div>

          <button type="submit" id="btnLogin" class="btn btn-primary btn-block btn-lg mt-6">Masuk ke Panel</button>
        </form>
      </div>

      <!-- 2. FORM REGISTER -->
      <div id="registerSection" class="hidden">
        <h2>Daftar Akun Baru</h2>
        <p>Bergabunglah menjadi penjual UMKM Cemilan Ciamis</p>

        <form id="registerForm" style="text-align: left;">
          <div class="form-group">
            <label class="form-label" for="regShopName">Nama Toko</label>
            <input type="text" class="form-input" id="regShopName" placeholder="Contoh: Keripik Bu Siti" required>
          </div>
          <div class="form-group mt-4">
            <label class="form-label" for="regSellerName">Nama Lengkap Pemilik</label>
            <input type="text" class="form-input" id="regSellerName" placeholder="Sesuai KTP" required>
          </div>
          <div class="form-group mt-4">
            <label class="form-label" for="regEmail">Email</label>
            <input type="email" class="form-input" id="regEmail" placeholder="email@contoh.com" required autocomplete="username">
          </div>
          <div class="form-group mt-4">
            <label class="form-label" for="regWhatsapp">No. WhatsApp</label>
            <input type="tel" class="form-input" id="regWhatsapp" placeholder="Contoh: 6281234567890" required>
          </div>
          <div class="form-group mt-4">
            <label class="form-label" for="regPassword">Password</label>
            <div class="password-wrapper">
              <input type="password" class="form-input" id="regPassword" placeholder="Minimal 6 karakter" required autocomplete="new-password">
              <button type="button" class="btn-toggle-password" id="btnToggleRegPassword">👁️</button>
            </div>
          </div>
          <button type="submit" id="btnRegister" class="btn btn-primary btn-block btn-lg mt-6">Daftar Sekarang</button>
        </form>
      </div>      <p id="errorMessage" class="form-error hidden mt-4" style="text-align: center;"></p>
      <div id="successMessage" class="success-box hidden mt-4" style="text-align: center;"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/data.js"></script>
  <script>
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const btnTogglePassword = document.getElementById('btnTogglePassword');
    const btnToggleRegPassword = document.getElementById('btnToggleRegPassword');
    const regPasswordInput = document.getElementById('regPassword');
    
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');

    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const loginSection = document.getElementById('loginSection');
    const registerSection = document.getElementById('registerSection');

    // Tab Switching
    tabLogin.addEventListener('click', () => {
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
      loginSection.classList.remove('hidden');
      registerSection.classList.add('hidden');
      hideError();
      hideSuccess();
    });

    tabRegister.addEventListener('click', () => {
      tabRegister.classList.add('active');
      tabLogin.classList.remove('active');
      registerSection.classList.remove('hidden');
      loginSection.classList.add('hidden');
      hideError();
      hideSuccess();
    });

    // Toggle Password Visibility
    btnTogglePassword.addEventListener('click', () => {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        btnTogglePassword.textContent = '🙈';
      } else {
        passwordInput.type = 'password';
        btnTogglePassword.textContent = '👁️';
      }
    });

    btnToggleRegPassword.addEventListener('click', () => {
      if (regPasswordInput.type === 'password') {
        regPasswordInput.type = 'text';
        btnToggleRegPassword.textContent = '🙈';
      } else {
        regPasswordInput.type = 'password';
        btnToggleRegPassword.textContent = '👁️';
      }
    });

    // Submit Handler Login
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      hideSuccess();
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      const btn = document.getElementById('btnLogin');
      const originalText = btn ? btn.textContent : 'Masuk ke Panel';
      if (btn) {
        btn.disabled = true;
        btn.textContent = '⏳ Memproses...';
      }

      // Supabase Login
      const authResult = await loginSellerToSupabase(email, password);
      
      if (btn) {
        btn.disabled = false;
        btn.textContent = originalText;
      }

      if (authResult.success) {
        completeLogin(authResult);
      } else {
        showError(authResult.message || 'Email atau password salah.');
      }
    });

    // Submit Handler Register
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      hideSuccess();
      
      const shopName = document.getElementById('regShopName').value.trim();
      const sellerName = document.getElementById('regSellerName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const whatsapp = document.getElementById('regWhatsapp').value.trim();
      const password = regPasswordInput.value;

      if (password.length < 6) {
        showError('Password minimal 6 karakter.');
        return;
      }

      const btn = document.getElementById('btnRegister');
      const originalText = btn ? btn.textContent : 'Daftar Sekarang';
      if (btn) {
        btn.disabled = true;
        btn.textContent = '⏳ Menyimpan...';
      }

      // Supabase Register
      const authResult = await registerSellerToSupabase(email, password, shopName, sellerName, whatsapp);
      
      if (btn) {
        btn.disabled = false;
        btn.textContent = originalText;
      }

      if (authResult.success) {
        showSuccess(authResult.message);
        registerForm.reset();
        // Switch back to login tab after success
        setTimeout(() => tabLogin.click(), 3000);
      } else {
        showError(authResult.message || 'Gagal mendaftar.');
      }
    });

    function completeLogin(authResult) {
      try {
        localStorage.setItem('adminLoggedIn', 'true');
        localStorage.setItem('adminSellerId', authResult.seller.id);
        localStorage.setItem('adminRole', authResult.role || 'seller');
        window.location.href = 'dashboard.html';
      } catch (err) {
        showError('Gagal menyimpan sesi browser.');
      }
    }

    function showError(msg) {
      errorMessage.textContent = msg;
      errorMessage.classList.remove('hidden');
    }
    function hideError() { errorMessage.classList.add('hidden'); }
    function showSuccess(msg) {
      successMessage.textContent = msg;
      successMessage.classList.remove('hidden');
    }
    function hideSuccess() { successMessage.classList.add('hidden'); }
  </script>
</body>
</html>
