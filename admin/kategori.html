<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kelola Kategori - Panel Super Admin</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

  <!-- Topbar -->
  <div class="admin-topbar">
    <div class="container flex-between align-center">
      <div class="admin-topbar__title">Kelola Kategori</div>
      <button class="btn btn-primary btn-sm" onclick="openAddModal()">➕ Tambah</button>
    </div>
  </div>

  <!-- Content -->
  <div class="container mt-6 mb-8">
    <div id="loading" class="text-center py-4 text-sm color-muted">⏳ Memuat kategori...</div>
    <div id="categoryList" class="flex-column gap-3">
      <!-- Kategori akan dirender di sini -->
    </div>
  </div>

  <!-- Add Modal -->
  <div class="modal" id="addModal">
    <div class="modal__overlay" onclick="closeAddModal()"></div>
    <div class="modal__content">
      <h3 class="mb-4">Tambah Kategori Baru</h3>
      <form id="addCategoryForm">
        <div class="form-group">
          <label class="form-label" for="inputId">ID Kategori (huruf kecil, tanpa spasi)</label>
          <input type="text" class="form-input" id="inputId" placeholder="contoh: keripik-pedas" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="inputName">Nama Kategori</label>
          <input type="text" class="form-input" id="inputName" placeholder="contoh: Keripik Pedas" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="inputIcon">Ikon Emoji</label>
          <input type="text" class="form-input" id="inputIcon" placeholder="contoh: 🌶️" required maxlength="10">
        </div>
        <div class="flex-between mt-6 gap-2">
          <button type="button" class="btn btn-outline" style="flex:1;" onclick="closeAddModal()">Batal</button>
          <button type="submit" class="btn btn-primary" style="flex:1;">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <div class="bottom-nav__items">
      <a href="dashboard.html" class="bottom-nav__item">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        Dashboard
      </a>
      <a href="produk.html" class="bottom-nav__item">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
        Produk
      </a>
      <a href="kategori.html" class="bottom-nav__item active">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
        Kategori
      </a>
      <a href="profil.html" class="bottom-nav__item">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        Profil
      </a>
    </div>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/data.js"></script>
  <script>
    if(localStorage.getItem('adminLoggedIn') !== 'true') {
      window.location.href = 'login.html';
    }

    const sellerId = localStorage.getItem('adminSellerId') || 'bu-siti';
    const role = sellerId === 'super-admin' ? 'super_admin' : 'seller';

    if (role !== 'super_admin') {
      alert('Halaman ini khusus Super Admin!');
      window.location.href = 'dashboard.html';
    }

    const categoryList = document.getElementById('categoryList');
    const loading = document.getElementById('loading');

    async function loadCategories() {
      loading.style.display = 'block';
      categoryList.innerHTML = '';
      
      const res = await fetchCategories();
      loading.style.display = 'none';

      if (!res.success) {
        categoryList.innerHTML = `<div class="text-center text-sm color-danger">Gagal memuat: ${res.message}</div>`;
        return;
      }

      const categories = res.data;
      if (categories.length === 0) {
        categoryList.innerHTML = `<div class="text-center text-sm color-muted py-4">Belum ada kategori. Silakan tambahkan.</div>`;
        return;
      }

      categoryList.innerHTML = categories.map(c => `
        <div class="card p-4 flex-between align-center">
          <div class="flex align-center gap-3">
            <div style="font-size: 1.5rem;">${c.icon || '📦'}</div>
            <div>
              <div class="font-semi">${c.name}</div>
              <div class="text-xs color-muted">ID: ${c.id}</div>
            </div>
          </div>
          <button class="btn btn-sm btn-outline" style="color: var(--danger-500); border-color: var(--danger-500);" onclick="handleDelete('${c.id}')">Hapus</button>
        </div>
      `).join('');
    }

    function openAddModal() {
      document.getElementById('addModal').classList.add('active');
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.remove('active');
      document.getElementById('addCategoryForm').reset();
    }

    document.getElementById('addCategoryForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('inputId').value.trim();
      const name = document.getElementById('inputName').value.trim();
      const icon = document.getElementById('inputIcon').value.trim();

      const btn = e.target.querySelector('button[type="submit"]');
      const origText = btn.textContent;
      btn.textContent = '⏳ Menyimpan...';
      btn.disabled = true;

      const res = await addCategory(id, name, icon);
      
      btn.textContent = origText;
      btn.disabled = false;

      if (res.success) {
        closeAddModal();
        loadCategories();
      } else {
        alert('Gagal: ' + res.message);
      }
    });

    async function handleDelete(id) {
      if (!confirm('Apakah Anda yakin ingin menghapus kategori ini?')) return;
      
      const res = await deleteCategory(id);
      if (res.success) {
        loadCategories();
      } else {
        alert('Gagal menghapus: ' + res.message);
      }
    }

    loadCategories();
  </script>
</body>
</html>
